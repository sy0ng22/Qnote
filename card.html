<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Created - Qnote</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <!-- Navigation -->
    <nav class="nav-bar">
      <button class="nav-button" onclick="location.href='/'">← Back</button>
      <div style="flex: 1;"></div>
    </nav>

    <!-- Main Content -->
    <main class="content">
      <!-- Card Title -->
      <h2 class="card-title">Generated Card</h2>

      <!-- Card Preview -->
      <div class="card-preview">
        <div class="preview-card" id="cardPreview">
          <div class="preview-date" id="previewDate">October 11, 2025</div>
          <div class="preview-label">TODAY'S QUESTION</div>
          <div class="preview-question" id="previewQuestion">When was your most peaceful moment?</div>
          <div class="preview-answer-label">Your Answer</div>
          <div class="preview-answer" id="previewAnswer">Write freely...</div>
          <div class="preview-footer">🌿 Qnote</div>
        </div>
      </div>

      <!-- Status -->
      <div id="statusMessage" style="display: none;"></div>

      <!-- Action Buttons -->
      <div class="button-group">
        <button class="button" id="shareButton">
          <svg class="share-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>
          </svg>
          Share on Farcaster
        </button>
        <button class="button button-secondary" id="nftButton">
          <svg class="share-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span id="nftButtonText">Mint as NFT</span>
        </button>
      </div>
    </main>
  </div>

  <script type="module">
    import html2canvas from 'html2canvas';
    import dayjs from 'dayjs';
    import sdk from '@farcaster/frame-sdk';
    import { loadAnswer, saveAnswer, generateShareText } from '/utils.js';
    import { getTodayQuestion } from '/questions.js';

    // Set English locale
    dayjs.locale('en');

    const cardPreview = document.getElementById('cardPreview');
    const previewDate = document.getElementById('previewDate');
    const previewQuestion = document.getElementById('previewQuestion');
    const previewAnswer = document.getElementById('previewAnswer');
    const statusMessage = document.getElementById('statusMessage');
    const shareButton = document.getElementById('shareButton');
    const nftButton = document.getElementById('nftButton');
    const nftButtonText = document.getElementById('nftButtonText');

    let currentData = null;
    let isGenerating = false;

    // Initialize Farcaster SDK
    sdk.actions.ready();

    // Load data
    function loadData() {
      const { date } = getTodayQuestion();
      const data = loadAnswer(date);

      if (!data || !data.text) {
        alert('No saved answer found. Please write an answer first.');
        location.href = '/';
        return;
      }

      currentData = data;
      
      // Update card preview
      previewDate.textContent = dayjs(data.date).format('MMMM D, YYYY');
      previewQuestion.textContent = data.question;
      previewAnswer.textContent = data.text;
    }

    // Generate card image
    async function generateCard() {
      if (isGenerating) return null;
      
      try {
        isGenerating = true;
        statusMessage.textContent = 'Generating card...';
        statusMessage.className = 'loading';
        statusMessage.style.display = 'block';
        
        shareButton.disabled = true;
        nftButton.disabled = true;

        const canvas = await html2canvas(cardPreview, {
          backgroundColor: '#FFFFFF',
          scale: 2,
          logging: false,
          width: cardPreview.offsetWidth,
          height: cardPreview.offsetHeight
        });

        const imgUrl = canvas.toDataURL('image/png');

        // Save image URL
        currentData.imgUrl = imgUrl;
        saveAnswer(currentData.date, currentData);

        statusMessage.style.display = 'none';
        return imgUrl;
      } catch (error) {
        console.error('Card generation failed:', error);
        statusMessage.textContent = 'Failed to generate card. Please try again.';
        statusMessage.className = 'error';
        throw error;
      } finally {
        isGenerating = false;
        shareButton.disabled = false;
        nftButton.disabled = false;
      }
    }

    // Share on Farcaster button
    shareButton.addEventListener('click', async () => {
      try {
        shareButton.disabled = true;
        shareButton.innerHTML = 'Preparing...';

        // Generate image if not exists
        if (!currentData.imgUrl) {
          statusMessage.textContent = 'Generating card...';
          statusMessage.className = 'loading';
          statusMessage.style.display = 'block';
          await generateCard();
        }

        // Generate share text with card URL
        const appUrl = import.meta.env.VITE_APP_URL || 'https://qnote-two.vercel.app';
        const cardUrl = `${appUrl}/api/card-view?date=${currentData.date}&answer=${encodeURIComponent(currentData.text)}`;
        
        // Show current card image as preview (로컬에서도 보임)
        statusMessage.innerHTML = `
          <strong>✓ Card ready to share!</strong><br>
          <small style="display: block; margin-top: 8px;">This is what will appear on Farcaster:</small>
          <img src="${currentData.imgUrl}" style="width: 100%; max-width: 400px; border-radius: 8px; margin-top: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);" alt="Card Preview" />
        `;
        statusMessage.className = 'success';
        statusMessage.style.display = 'block';
        
        // Share text without URL (URL will be in embeds)
        const shareText = `Daily Question 🌿
${currentData.question}
→ ${currentData.text}

#Qnote #DailyQuestion DQ:${currentData.date}`;
        
        console.log('Share text:', shareText);
        console.log('Card URL:', cardUrl);

        // Build Warpcast composer URL with text and embeds
        const params = new URLSearchParams({
          text: shareText,
          'embeds[]': cardUrl
        });
        
        const composeUrl = `https://warpcast.com/~/compose?${params.toString()}`;
        console.log('Full compose URL:', composeUrl);
        
        // Open in new tab (not popup window)
        const newTab = window.open(composeUrl, '_blank');
        
        if (newTab) {
          console.log('Tab opened successfully');
          // Redirect to home after 1 second
          setTimeout(() => {
            location.href = '/';
          }, 1000);
        } else {
          console.log('Popup blocked, copying to clipboard');
          // Popup blocked - copy link to clipboard
          await navigator.clipboard.writeText(cardUrl);
          statusMessage.textContent = '⚠️ Popup blocked. Link copied to clipboard.\nPlease paste it on Farcaster to share your card.';
          statusMessage.className = 'error';
          statusMessage.style.display = 'block';
        }

      } catch (error) {
        console.error('Share failed:', error);
        
        // Fallback: copy link to clipboard
        try {
          const appUrl = import.meta.env.VITE_APP_URL || 'https://qnote-two.vercel.app';
          const cardUrl = `${appUrl}/api/card-view?date=${currentData.date}&answer=${encodeURIComponent(currentData.text)}`;
          await navigator.clipboard.writeText(cardUrl);
          statusMessage.textContent = 'Link copied to clipboard! Please paste it on Farcaster to share your card.';
          statusMessage.className = 'success';
          statusMessage.style.display = 'block';
        } catch (clipboardError) {
          statusMessage.textContent = 'Failed to share. Please try again.';
          statusMessage.className = 'error';
          statusMessage.style.display = 'block';
        }
      } finally {
        shareButton.disabled = false;
        shareButton.innerHTML = `
          <svg class="share-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>
          </svg>
          Share on Farcaster
        `;
      }
    });

    // Mint NFT button
    nftButton.addEventListener('click', async () => {
      try {
        nftButton.disabled = true;
        nftButtonText.textContent = 'Preparing...';
        statusMessage.textContent = '🎨 Preparing to mint NFT...';
        statusMessage.className = 'loading';
        statusMessage.style.display = 'block';

        // Generate image if not exists
        if (!currentData.imgUrl) {
          await generateCard();
        }

        // Import NFT utilities dynamically
        const { uploadToIPFS, mintNFTWithMintClub, saveAnswer } = await import('/utils.js');
        
        // Step 1: Check Farcaster wallet
        statusMessage.textContent = '🔐 Connecting to Farcaster wallet...';
        nftButtonText.textContent = 'Connecting...';
        
        let farcasterAvailable = false;
        try {
          const context = await sdk.context;
          farcasterAvailable = !!(context && context.user);
        } catch (e) {
          throw new Error('This feature only works in Farcaster. Please open this app in Warpcast.');
        }

        if (!farcasterAvailable) {
          throw new Error('Farcaster wallet not detected. Please open this app in Warpcast.');
        }

        const metadata = {
          name: `Qnote Daily Question - ${currentData.date}`,
          description: `Daily Question: ${currentData.question}\nAnswer: ${currentData.text}`,
          question: currentData.question,
          date: currentData.date
        };
        
        // Check if NFT.Storage API key is configured
        const hasNFTStorageKey = import.meta.env.VITE_NFT_STORAGE_API_KEY;
        
        if (!hasNFTStorageKey) {
          throw new Error('NFT.Storage API key is required. Please add VITE_NFT_STORAGE_API_KEY to your .env file.');
        }

        // Step 2: Upload to IPFS
        statusMessage.textContent = '📤 Uploading to IPFS...';
        nftButtonText.textContent = 'Uploading...';
        
        const ipfsData = await uploadToIPFS(currentData.imgUrl, metadata);
        
        // Save IPFS data
        currentData.ipfsUrl = ipfsData.imageUrl;
        currentData.metadataUrl = ipfsData.metadataUrl;
        saveAnswer(currentData.date, currentData);
        
        statusMessage.innerHTML = `
          <strong>✓ Uploaded to IPFS!</strong><br>
          <small><a href="${ipfsData.imageUrl}" target="_blank" style="color: inherit; text-decoration: underline;">View on IPFS</a></small>
        `;
        
        // Step 3: Mint NFT on blockchain with MintClub
        statusMessage.innerHTML = `
          <strong>🎨 Minting NFT on Base...</strong><br>
          <small>Please approve the transaction in your wallet</small>
        `;
        nftButtonText.textContent = 'Minting...';
        
        const mintResult = await mintNFTWithMintClub(sdk, ipfsData.imageUrl, metadata);
        
        // Success!
        statusMessage.innerHTML = `
          <strong>🎉 NFT Minted Successfully!</strong><br>
          <small>Network: ${mintResult.network}</small><br>
          <small>Tx: <a href="https://basescan.org/tx/${mintResult.txHash}" target="_blank" style="color: inherit; text-decoration: underline;">${mintResult.txHash.substring(0, 10)}...</a></small><br>
          <small>Your NFT is now on the blockchain! 🚀</small>
        `;
        statusMessage.className = 'success';
        nftButtonText.textContent = '✓ Minted!';

      } catch (error) {
        console.error('NFT minting failed:', error);
        statusMessage.innerHTML = `
          <strong>⚠️ Minting preparation failed</strong><br>
          <small>${error.message || 'Please try again'}</small>
        `;
        statusMessage.className = 'error';
      } finally {
        nftButton.disabled = false;
        nftButtonText.textContent = 'Mint as NFT';
      }
    });

    // Load data on page load
    loadData();

    // Auto-generate card if not exists
    if (currentData && !currentData.imgUrl) {
      generateCard();
    }
  </script>
</body>
</html>
