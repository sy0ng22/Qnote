<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qnote - Daily Question</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .home-button {
      position: fixed;
      top: 24px;
      left: 24px;
      padding: 12px 24px;
      background: white;
      color: #1A1A1A;
      border: 1px solid #d2d2d7;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      z-index: 100;
      transition: all 0.2s ease;
    }

    .home-button:hover {
      background: #f5f5f7;
      transform: translateY(-2px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
  </style>
</head>
<body>
  <button class="home-button" onclick="location.href='/'">← Home</button>
  
  <div class="container">
    <!-- App Header -->
    <header class="app-header">
      <h1 class="app-title">Daily Question</h1>
      <p class="app-subtitle">A moment to reflect, once a day</p>
    </header>

    <!-- Date -->
    <div class="date-display" id="dateDisplay">
      October 11, 2025 Saturday
    </div>

    <!-- Main Content -->
    <main class="content" id="mainContent">
      <!-- Question Section -->
      <section class="question-section">
        <div class="section-label">TODAY'S QUESTION</div>
        <div class="question-text" id="questionText">When was your most peaceful moment?</div>
      </section>

      <!-- Answer Card Section -->
      <section class="answer-card-wrapper" id="answerSection">
        <div class="answer-card">
          <label class="input-label" for="answerInput">Your Answer</label>
          <textarea 
            class="textarea" 
            id="answerInput" 
            placeholder="Write freely..."
            maxlength="500"
          ></textarea>
          <div class="char-counter">
            <span id="charCount">0</span> / 500
          </div>
        </div>
      </section>

      <!-- Already Answered Message (hidden by default) -->
      <section class="answer-card-wrapper" id="alreadyAnsweredSection" style="display: none;">
        <div class="answer-card" style="text-align: center; padding: 48px 24px;">
          <div style="font-size: 48px; margin-bottom: 16px;">✓</div>
          <div style="font-size: 20px; font-weight: 600; color: var(--text-primary); margin-bottom: 12px;">
            You've already completed today's answer
          </div>
          <div style="font-size: 14px; color: var(--text-secondary); margin-bottom: 24px;">
            Come back tomorrow for a new question
          </div>
          <button class="button" onclick="location.href='/card.html'" style="margin-top: 16px;">
            View Your Card →
          </button>
        </div>
      </section>

      <!-- Action Button -->
      <button class="button" id="nextButton" disabled>
        Create Card →
      </button>
    </main>
  </div>

  <script type="module">
    import dayjs from 'dayjs';
    import { getTodayQuestion } from '/questions.js';
    import { saveAnswer, loadAnswer } from '/utils.js';

    const dateDisplay = document.getElementById('dateDisplay');
    const questionText = document.getElementById('questionText');
    const answerInput = document.getElementById('answerInput');
    const charCount = document.getElementById('charCount');
    const nextButton = document.getElementById('nextButton');
    const answerSection = document.getElementById('answerSection');
    const alreadyAnsweredSection = document.getElementById('alreadyAnsweredSection');

    // Get today's date and question
    const { question, date } = getTodayQuestion();
    
    // Display date
    dateDisplay.textContent = dayjs(date).format('MMMM D, YYYY dddd');
    
    // Display question
    questionText.textContent = question;

    // Check if already answered today
    const savedData = loadAnswer(date);
    if (savedData && savedData.text) {
      // Already answered - show message
      answerSection.style.display = 'none';
      alreadyAnsweredSection.style.display = 'block';
      nextButton.style.display = 'none';
    } else {
      // Not answered yet - show input form
      answerSection.style.display = 'block';
      alreadyAnsweredSection.style.display = 'none';
      nextButton.style.display = 'block';
    }

    // Update character count
    function updateCharCount() {
      const count = answerInput.value.length;
      charCount.textContent = count;
      nextButton.disabled = count === 0;
    }

    answerInput.addEventListener('input', updateCharCount);

    // Next step
    nextButton.addEventListener('click', () => {
      const answer = answerInput.value.trim();
      
      if (!answer) {
        alert('Please enter your answer.');
        return;
      }

      // Save data
      const data = {
        question,
        text: answer,
        date
      };

      saveAnswer(date, data);

      // Go to card creation page
      location.href = '/card.html';
    });

    // Initial state check
    updateCharCount();
  </script>
</body>
</html>
