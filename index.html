<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qnote - Daily Reflection</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .home-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .home-header {
      text-align: center;
      margin-bottom: 64px;
    }

    .home-logo {
      font-size: 64px;
      margin-bottom: 24px;
    }

    .home-title {
      font-size: 48px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 16px;
      letter-spacing: -1px;
    }

    .home-subtitle {
      font-size: 18px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .home-actions {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 400px;
    }

    .home-button {
      padding: 24px 32px;
      font-size: 20px;
      font-weight: 600;
      border-radius: var(--radius-lg);
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
    }

    .home-button-primary {
      background: white;
      color: #1A1A1A;
      border: 1px solid #d2d2d7;
    }

    .home-button-primary:hover:not(:disabled) {
      background: #f5f5f7;
      transform: translateY(-2px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .home-button-secondary {
      background: var(--bg-secondary);
      color: var(--text-secondary);
      cursor: not-allowed;
      opacity: 0.6;
    }

    .button-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .button-title {
      font-size: 20px;
      font-weight: 600;
    }

    .button-description {
      font-size: 14px;
      font-weight: 400;
      opacity: 0.8;
    }

    .button-icon {
      font-size: 24px;
    }

    .coming-soon {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      margin-left: 8px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="home-container">
    <!-- Header -->
    <div class="home-header">
      <div class="home-logo">🌿</div>
      <h1 class="home-title">Qnote</h1>
      <p class="home-subtitle">Daily reflection, one question at a time</p>
      
      <!-- Dev Reset Button -->
      <button 
        onclick="if(confirm('Clear all data?')) { localStorage.clear(); alert('Data cleared!'); }" 
        style="margin-top: 20px; padding: 8px 16px; background: #ff4444; color: white; border: none; border-radius: 8px; font-size: 12px; cursor: pointer;">
        🔄 Reset Data (Dev)
      </button>
    </div>

    <!-- Actions -->
    <div class="home-actions">
      <!-- Daily Button -->
      <button class="home-button home-button-primary" onclick="location.href='/daily.html'">
        <div class="button-content">
          <div class="button-title">Daily Question</div>
          <div class="button-description">Answer today's question</div>
        </div>
        <div class="button-icon">→</div>
      </button>

      <!-- Monthly Button -->
      <button class="home-button home-button-primary" onclick="location.href='/monthly.html'">
        <div class="button-content">
          <div class="button-title">Monthly Calendar</div>
          <div class="button-description">View this month's reflections</div>
        </div>
        <div class="button-icon">→</div>
      </button>
    </div>
  </div>
</body>
</html>
